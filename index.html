<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEONGHYE KIM — PORTFOLIO</title>
    <link rel="icon" href="./img/favicon_2.png" type="image/png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* 기본 스타일 및 그리드 설정 */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* PC에서는 2열 */
            gap: 40px;
            margin-top: 50px;
        }

        .project-card {
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }

        .project-card:hover { transform: translateY(-10px); }

        .project-img-box {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #f4f4f4;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #eee;
        }

        .project-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-info { margin-top: 20px; }
        .project-info h2 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; color: #111; }
        .project-info p { font-size: 1rem; color: #666; line-height: 1.5; }

        /* ============================================================
           📱 모바일 반응형 (768px 이하)
        ============================================================ */
        @media (max-width: 768px) {
            header { padding: 60px 0 40px !important; }
            header h1 { font-size: 2.5rem !important; }

            /* 네비게이션 간격 조정 */
            nav { padding: 15px 0 !important; }
            nav div { font-size: 0.8rem !important; }

            /* 프로젝트 리스트 2열 -> 1열 변경 */
            .project-grid {
                grid-template-columns: 1fr; 
                gap: 50px; /* 카드 사이 간격 확보 */
            }

            .project-img-box { aspect-ratio: 1 / 1; /* 모바일은 정사가까운 비율로 시원하게 */ }

            .project-info h2 { font-size: 1.3rem; }
            .project-info p { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <nav style="display: flex; justify-content: space-between; align-items: center; padding: 30px 0;">
            <div style="font-weight: 800; letter-spacing: 0.05em;">SEONGHYE KIM</div>
            <div style="font-size: 0.9rem; font-weight: 700;">GRACIEEKEEM@GMAIL.COM</div>
        </nav>

        <header style="padding: 100px 0 60px;">
            <h1 style="font-size: 4.5rem; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em;">
                Strategic Marketer <br>& Content Creator
            </h1>
        </header>

        <main>
            <div class="project-grid">
                
                <a href="./leedslab/index.html" class="project-card">
                    <div class="project-img-box">
                        <img src="./img/leedslab/main_thumb.jpg" alt="Leeds Lab">
                    </div>
                    <div class="project-info">
                        <span style="font-size: 0.8rem; font-weight: 700; color: #634e42;">PROJECT 01</span>
                        <h2>리즈랩 (Leeds Lab)</h2>
                        <p>헬스케어 브랜드 SNS · BTL 운영 및 콘텐츠 마케팅</p>
                    </div>
                </a>

                <a href="./chemeet/index.html" class="project-card">
                    <div class="project-img-box">
                        <img src="./img/chemeet/main_thumb.jpg" alt="Chemeet">
                    </div>
                    <div class="project-info">
                        <span style="font-size: 0.8rem; font-weight: 700; color: #634e42;">PROJECT 02</span>
                        <h2>케밋 (Chemeet)</h2>
                        <p>브랜드 퍼포먼스 마케팅 및 광고 전략 수립</p>
                    </div>
                </a>

            </div>
        </main>

        <footer style="margin-top: 120px; padding: 40px 0; border-top: 1px solid #eee; text-align: center;">
            <p style="font-size: 0.8rem; color: #aaa; letter-spacing: 0.1em;">© 2026 SEONGHYE KIM. ALL RIGHTS RESERVED.</p>
        </footer>
    </div>

</body>
</html>
