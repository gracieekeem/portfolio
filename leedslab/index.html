<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEEDSLAB — SEONGHYE KIM</title>
    <link rel="icon" href="../image/favicon_2.png" type="image/png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="../css/style.css">
   <style>
    /* 질서와 간격을 위한 추가 스타일 */
    .content-section { margin-bottom: 100px; }
    .display-row { display: flex; gap: 30px; margin-bottom: 30px; align-items: flex-start; }
    .info-side { flex: 1; }
    .image-side { flex: 1.5; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    
    /* 원본 비율 유지 및 깔끔한 간격 */
    .asset-img { width: 100%; height: auto; border: 1px solid #f0f0f0; display: block; }
    .full-img { width: 100%; height: auto; margin-top: 20px; }
    
    .project-label { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; color: #000; margin-bottom: 10px; display: block; }
    .project-desc { font-size: 0.9rem; color: #666; line-height: 1.6; }
</style>

<main>
    <section class="content-section">
        <div class="display-row">
            <div class="info-side">
                <span class="project-label">SNS CATEGORY: PLE:EDS</span>
                <p class="project-desc">
                    월간 무드 기반의 음악 큐레이션 콘텐츠.<br>
                    인스타그램 피드와 유튜브를 연계한<br>신규 카테고리 제안 및 운영.
                </p>
            </div>
            <div class="image-side" style="grid-template-columns: 1.2fr 1fr;">
                <img src="../image/leedslab/01_leedslab_intagram_pleeds.jpg" class="asset-img">
                <img src="../image/leedslab/01_leedslab_youtube_pleeds_2.jpg" class="asset-img">
            </div>
        </div>
    </section>

    <section class="content-section">
        <span class="project-label">VISUAL & REVIEW ARCHIVE</span>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px;">
            <div>
                <img src="../image/leedslab/01_leedslab_product_1.jpg" class="asset-img">
                <img src="../image/leedslab/01_leedslab_intagram_leeview_1.jpg" class="asset-img" style="margin-top:20px;">
            </div>
            <div>
                <img src="../image/leedslab/01_leedslab_product_2.jpg" class="asset-img">
                <img src="../image/leedslab/01_leedslab_intagram_leeview_2.jpg" class="asset-img" style="margin-top:20px;">
            </div>
            <div>
                <img src="../image/leedslab/01_leedslab_intagram_mood.jpg" class="asset-img">
                <img src="../image/leedslab/01_leedslab_intagram_leedslife_3.jpg" class="asset-img" style="margin-top:20px;">
            </div>
        </div>
    </section>

    <section class="content-section">
        <div class="display-row" style="flex-direction: row-reverse;">
            <div class="info-side" style="text-align: right;">
                <span class="project-label">BTL FIELD OPERATION</span>
                <p class="project-desc">
                    성수 팝업 및 대학 축제 현장 운영 지원.<br>
                    실시간 랭킹 1위 성과 도출 및<br>현장 기록의 콘텐츠 자산화.
                </p>
            </div>
            <div class="image-side" style="grid-template-columns: 1fr;">
                <img src="../image/leedslab/포트폴리오_김성혜_페이지_05.jpg" class="asset-img">
            </div>
        </div>

</main>

        <footer style="margin-top: 100px; padding: 40px 0; border-top: 1px solid #eee; text-align: center;">

    </div>
